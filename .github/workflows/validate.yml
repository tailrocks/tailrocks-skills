name: validate
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  validate:
    # Dispatch-only: post-merge push and pull requests already run every one of
    # these checks (validate-skills, generated-docs drift, script tests, shell
    # template parse) through the generated CI lane's gate tasks, so a second
    # copy here would re-execute them per commit. Dispatch keeps a manual
    # full-validation lane outside the CI workflow's own dispatch surface.
    if: github.event_name == 'workflow_dispatch'
    name: validate (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        # Velnor is the default lane; dispatch selects lanes explicitly, `both`
        # runs each fleet from this one definition with identical steps.
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.velnor_default_runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ci

  latest-stable:
    name: latest-stable (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || github.event_name == 'push' && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.velnor_default_runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun skills/tailrocks-tanstack-project-setup/scripts/resolve-package-versions.ts --check-template skills/tailrocks-tanstack-project-setup/templates/package.json
      - run: bun scripts/check-baseline-age.ts
      - name: Open or update scheduled-gate issue
        if: failure() && github.event_name == 'schedule' && matrix.config.writer
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled latest-stable gate failed"
        run: |
          number=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          body="Scheduled latest-stable or platform-baseline check failed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  templates-macos:
    # No macOS runner exists on the Velnor fleet and these gates fundamentally
    # need macOS (swiftc, the visual-QA capture harness), so this job is
    # excluded from the Velnor default and runs only on the non-default GitHub
    # dispatch lane (lanes=github or both).
    if: github.event_name == 'workflow_dispatch' && inputs.lanes != 'velnor'
    name: templates-macos (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON('[{"lane":"GitHub","velnor_default_runner":"macos-26"}]') }}
    runs-on: ${{ matrix.config.velnor_default_runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Parse Swift templates
        run: find skills scripts -type d -name evals -prune -o -path '*/templates/*.swift' -type f -print0 | xargs -0 -n1 swiftc -parse
      - name: Run native macOS harness tests
        run: bun test scripts/macos-visual-qa/install.test.ts --timeout=60000
      - name: Run macOS PR sandbox integration tests
        run: bun test scripts/create-pr.test.ts --timeout=60000
      - name: Run macOS process supervision integration tests
        run: bun test scripts/bounded-command.test.ts scripts/prove-driver.test.ts --timeout=60000
      - name: Verify capture refuses a missing application
        run: |
          set +e
          scripts/macos-visual-qa/templates/capture.sh /tmp/Fake.app X out.png
          code=$?
          set -e
          test "$code" -eq 2
