name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: read

env:
  DOCS_SITE_URL: https://skills.tailrocks.com

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pull requests and merge groups verify the site build once per commit in
    # the generated CI lane's build gate (`mise run build`), so this job runs
    # only where its output is consumed: the post-merge deploy to GitHub Pages
    # and manual dispatch.
    if: github.event_name != 'schedule'
    name: build (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        # Velnor is the default lane. Post-merge pushes route to the GitHub
        # lane because the fleet rejects merged-push occupancy
        # (merged_push_occupancy); dispatch selects lanes explicitly, `both`
        # runs each fleet from this one definition with identical steps.
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || github.event_name == 'push' && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.velnor_default_runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache docs dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/node_modules
          key: docs-node-modules-${{ runner.os }}-${{ hashFiles('docs/bun.lock') }}
          restore-keys: docs-node-modules-${{ runner.os }}-
      - run: mise run build
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist/client

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    name: deploy (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        # Deploy is a post-merge push job, so it always runs on the GitHub lane
        # (merged_push_occupancy); the expression stays lane-aware so the
        # workflow definition remains identical across fleets.
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || github.event_name == 'push' && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.velnor_default_runner }}
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify-deployed:
    name: Verify deployed documentation (${{ matrix.config.lane }})
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.deploy.result == 'success'))
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || github.event_name == 'push' && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.velnor_default_runner }}
    timeout-minutes: 10
    steps:
      - name: Verify custom-domain site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            home=$(curl --compressed --fail --silent --show-error --location "${DOCS_SITE_URL}/" | tr -d '\000') || true
            skills=$(curl --compressed --fail --silent --show-error --location "${DOCS_SITE_URL}/docs/skills" | tr -d '\000') || true
            if grep -q '<title>tailrocks-skills</title>' <<< "$home" &&
               grep -q 'tailrocks-rust-best-practices' <<< "$skills" &&
               ! grep -q '/tailrocks-skills/' <<< "$home"; then
              exit 0
            fi
            echo "Documentation not ready (attempt ${attempt}/20)"
            sleep 15
          done
          echo "Documentation failed content verification: ${DOCS_SITE_URL}/" >&2
          exit 1
