workspace_root/mise.toml\"; test ! -L \"$workspace_root/mise.toml\"; /usr/bin/sha256sum  \"$workspace_root/mise.toml\" > \"$task_root/sha256.txt\"; read actual rest < \"$task_root/sha256.txt\"; test \"$actual\" = \"2681b8c82f18c52aaf6cf5222b842b33c39615e5e2b102811f64109c5c08dcd5\"; test ! -e \"$workspace_root/mise.lock\" && test ! -L \"$workspace_root/mise.lock\"; test ! -e \"$workspace_root/rust-toolchain.toml\" && test ! -L \"$workspace_root/rust-toolchain.toml\"; cd -P \"$workspace_root\"; command -v jq > \"$task_root/jq_path.txt\"; IFS= read -r jq_path < \"$task_root/jq_path.txt\"; test -n \"$jq_path\"; test -x \"$jq_path\"; \"$jq_path\" --version | /usr/bin/grep -Fqx '\\''jq-1.8.2'\\''; mise --no-env --no-hooks config ls --json | \"$jq_path\" -r '\\''.[].path'\\'' | LC_ALL=C /usr/bin/sort > \"$task_root/mise_configs.txt\"; workspace_config_found=false; while IFS= read -r path; do case \"$path\" in \"$workspace_root/mise.toml\") workspace_config_found=true ;; \"$workspace_root/rust-toolchain.toml\"|\"$task_root/global.toml\"|\"$task_root/system.toml\") ;; *) exit 1 ;; esac; done < \"$task_root/mise_configs.txt\"; [[ \"$workspace_config_found\" == true ]]; mise --no-env --no-hooks run --skip-tools validate-marketplace'"
