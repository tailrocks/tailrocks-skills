name: validate public unmerged
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: validate-public-unmerged-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run scripts/validate-skills.ts
      - run: bun run scripts/generate-docs.ts --check
      - run: bun test scripts/
      # Freshness against the live registry is a fact about the day, not about
      # the diff, so it runs on main and on a schedule. What a pull request can
      # be held to is that the pins and the documents quoting them agree.
      - run: bun scripts/refresh-template-pins.ts --check-consistency

  templates-macos:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse Swift templates
        run: find skills -path '*/templates/*.swift' -print0 | xargs -0 -n1 swiftc -parse
      - name: Verify capture refuses a missing application
        run: |
          set +e
          skills/tailrocks-macos-visual-qa/templates/capture.sh /tmp/Fake.app X out.png
          code=$?
          set -e
          test "$code" -eq 2
