name: validate public unmerged
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: validate-public-unmerged-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun run scripts/validate-skills.ts
      - run: bun run scripts/generate-docs.ts --check
      - run: bun test scripts/
      - run: bun skills/tailrocks-tanstack-project-setup/scripts/resolve-package-versions.ts --check-template skills/tailrocks-tanstack-project-setup/templates/package.json

  templates-macos:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse Swift templates
        run: find skills -path '*/templates/*.swift' -print0 | xargs -0 -n1 swiftc -parse
      - name: Verify capture refuses a missing application
        run: |
          set +e
          skills/tailrocks-macos-visual-qa/templates/capture.sh /tmp/Fake.app X out.png
          code=$?
          set -e
          test "$code" -eq 2
