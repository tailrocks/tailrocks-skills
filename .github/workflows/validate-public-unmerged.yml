name: validate public unmerged
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: validate-public-unmerged-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        # Velnor is the default lane for dispatch; public pull requests and
        # merge groups route to the GitHub lane (unmerged-public occupancy);
        # `both` runs each fleet from this one definition with identical steps.
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"lane":"GitHub","velnor_default_runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","velnor_default_runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.velnor_default_runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Skill validation, generated-docs drift, and the script test suite run
      # once per commit in the generated CI lane's gate tasks; repeating them
      # here re-executed each of them a second time on every pull request and
      # merge group. This job keeps the one predicate unique to the unmerged
      # public lane: the pins and the documents quoting them agree. Freshness
      # against the live registry is a fact about the day, not about the diff,
      # so it runs on main and on a schedule, never here.
      - run: bun scripts/refresh-template-pins.ts --check-consistency

  templates-macos:
    # No macOS runner exists on the Velnor fleet and these gates fundamentally
    # need macOS (swiftc, the visual-QA capture harness), so this job is
    # excluded from the Velnor default and runs only on the non-default GitHub
    # dispatch lane (lanes=github or both).
    if: github.event_name == 'workflow_dispatch' && inputs.lanes != 'velnor'
    name: templates-macos (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON('[{"lane":"GitHub","velnor_default_runner":"macos-26"}]') }}
    runs-on: ${{ matrix.config.velnor_default_runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Parse Swift templates
        run: find skills scripts -type d -name evals -prune -o -path '*/templates/*.swift' -type f -print0 | xargs -0 -n1 swiftc -parse
      - name: Run native macOS harness tests
        run: bun test scripts/macos-visual-qa/install.test.ts --timeout=60000
      - name: Run macOS PR sandbox integration tests
        run: bun test scripts/create-pr.test.ts --timeout=60000
      - name: Run macOS process supervision integration tests
        run: bun test scripts/bounded-command.test.ts scripts/prove-driver.test.ts --timeout=60000
      - name: Verify capture refuses a missing application
        run: |
          set +e
          scripts/macos-visual-qa/templates/capture.sh /tmp/Fake.app X out.png
          code=$?
          set -e
          test "$code" -eq 2
