# The marketplace owns this profile. Validate the version in this checkout.
# Child packages pin the separately published active-package profile.
version: 1
extends:
  - standards/alint/marketplace.yml
rules:
  # The catalog-*-agree rules compare ID and revision sets only, so a
  # URL, version, description, or displayName change without regen
  # slips through. This rule re-runs the generator and fails when any
  # generated catalog differs. It lives here because fetched profiles
  # cannot carry command rules.
  - id: catalogs-fresh
    kind: generated_file_fresh
    level: error
    command: ["python3", "scripts/generate-catalogs.py"]
    outputs:
      - ".claude-plugin/marketplace.json"
      - ".agents/plugins/marketplace.json"
      - ".kimi-plugin/marketplace.json"
    message: "Generated catalogs are stale. Run scripts/generate-catalogs.py."
  - id: marketplace-catalog-valid
    kind: command_idempotent
    level: error
    command: ["python3", "scripts/validate-marketplace.py"]
    message: "Marketplace catalogs, source refs, IDs, and privacy inventory must validate."
