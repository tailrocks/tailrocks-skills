# Marketplace repository alint configuration (alint v0.17.0).
# Extends the shared marketplace profile by immutable URL plus SHA-256 pin.
# Profile source: tailrocks/tailrocks-skills commit
# 0d7c9e7935f2d77cc23ae5903f108fb6faf949cf ("Emit tag refs with SHA
# pins in the Claude catalog (#126)"). Pin computed 2026-10-08 with
# `shasum -a 256` over the raw response body; the raw body is
# byte-identical to `git show 0d7c9e7:standards/alint/marketplace.yml`.
# Bump rule: one PR updates the REV and HASH together, then re-runs
# `alint check`.
version: 1
extends:
  - https://raw.githubusercontent.com/tailrocks/tailrocks-skills/0d7c9e7935f2d77cc23ae5903f108fb6faf949cf/standards/alint/marketplace.yml#sha256-c0d650d6db8fe67b11b5aac674950fb9ccd2c521eea10378205dcae71f050755
rules:
  # The catalog-*-agree rules compare ID and revision sets only, so a
  # URL, version, description, or displayName change without regen
  # slips through. This rule re-runs the generator and fails when any
  # generated catalog differs. It lives here because fetched profiles
  # cannot carry command rules.
  - id: catalogs-fresh
    kind: generated_file_fresh
    level: error
    command: ["python3", "scripts/generate-catalogs.py"]
    outputs:
      - ".claude-plugin/marketplace.json"
      - ".agents/plugins/marketplace.json"
      - ".kimi-plugin/marketplace.json"
    message: "Generated catalogs are stale. Run scripts/generate-catalogs.py."
