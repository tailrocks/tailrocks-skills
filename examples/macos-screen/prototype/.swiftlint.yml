# SwiftLint policy for the ConnectionsBoard prototype (project-setup baseline,
# scoped to the package's single source tree — the prototype ships no test
# targets; UI verification is the visual-qa lane).
# Gate invocation is `swiftlint --strict`. Without --strict a violation is a
# warning and the run exits successfully.

included:
  - Sources

excluded:
  - .build
  # ProtoMain.swift is the launch-contract harness copied from the
  # tailrocks-macos-prototype template. It is template-owned, never lifts
  # into the real app, and stays as shipped rather than being reworked to
  # satisfy lint (parse complexity, NSScreen.main force unwrap).
  - Sources/ConnectionsBoardProto/ProtoMain.swift

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - modifier_order
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - yoda_condition

disabled_rules:
  # swift-format owns layout. Leaving both to argue about it produces churn.
  - line_length
  - trailing_comma

# Force operations are errors in application code.
force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional:
  severity: error
  mode: all

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15

nesting:
  type_level: 2

custom_rules:
  hardcoded_corner_radius:
    name: "Hard-coded corner radius"
    regex: "(?:cornerRadius|cornerRadii)\\s*[:=(]\\s*[0-9]"
    message: "Derive the radius concentrically from the containing system surface; a numeric radius adjacent to a system container is a hard failure."
    severity: warning
    excluded: ".*Tests.*"

  vision_only_glass_api:
    name: "visionOS-only glass API"
    regex: "glassBackgroundEffect"
    message: "glassBackgroundEffect is visionOS only and does not exist on macOS."
    severity: error
