# Tool pins and task entry points for the ConnectionsBoard prototype.
# swiftlint 0.65.0 live-resolved as latest stable on 2026-08-17 (`mise ls-remote`).
# swift-format is NOT pinned on purpose: it ships with Xcode and is invoked
# through `xcrun`; installing a second copy makes it disagree with the editor's.

[tools]
swiftlint = "0.65.0"

[env]
# Staging for the launchable .app bundle. Must NOT be under /tmp,
# /private/tmp, or /var/folders: an app bundle launched from a temporary
# directory loses its windows within seconds, which breaks the capture loop.
PROTO_STAGE = "{{env.HOME}}/Library/Caches/tailrocks-prototype"

[tasks.build]
description = "Build the prototype executable"
run = "swift build"

[tasks.bundle]
description = "Build and assemble the launchable .app bundle in PROTO_STAGE"
run = "Scripts/bundle.sh $PROTO_STAGE"

[tasks.format]
description = "Format sources in place"
run = "xcrun swift-format format -i -r -p Sources"

[tasks."format:check"]
description = "Fail on formatting violations"
# --strict is mandatory: without it violations print and the run exits 0.
run = "xcrun swift-format lint --strict -r -p Sources"

[tasks.lint]
description = "Fail on lint violations"
run = "swiftlint --strict"

[tasks.check]
description = "Full gate: format, lint, build"
run = ["mise run format:check", "mise run lint", "mise run build"]
