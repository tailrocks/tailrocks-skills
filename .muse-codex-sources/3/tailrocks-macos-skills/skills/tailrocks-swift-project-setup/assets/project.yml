# XcodeGen manifest for a native macOS app.
# Replace every <marked> value. Regenerate with `xcodegen generate`.
# The generated .xcodeproj is NOT committed.

name: <App>

options:
  bundleIdPrefix: <com.example>
  deploymentTarget:
    macOS: "<26.0>"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Language mode, not compiler version. Legal values: 4, 4.2, 5, 6; never use a release such as 6.3.
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  <App>:
    type: application
    platform: macOS
    sources:
      # syncedFolder is load-bearing: without it every added file mutates the
      # generated project and the zero-diff property is lost.
      - path: Sources
        type: syncedFolder
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: <App>
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "<26.0>"
        NSHumanReadableCopyright: "<copyright>"
        # UIDesignRequiresCompatibility is deliberately absent. It is ignored
        # when building against the 27 SDK or later and support for opting into
        # the old design is being removed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: <com.example.App>
        GENERATE_INFOPLIST_FILE: NO
        # Ad-hoc signing: no developer account or team needed for local runs.
        # Real signing, hardened runtime, entitlements, and notarization belong
        # to the distribution pipeline, not the development loop.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Inert until an asset catalog or .icon source exists; macOS 26+ icons
        # come from Icon Composer (.icon), not an asset-catalog entry.
        # ASSETCATALOG_COMPILER_APPICON_NAME: <AppIcon>

  <App>Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        type: syncedFolder
    settings:
      base:
        # Test bundles have no committed Info.plist; without this the test
        # build fails at signing with "target does not have an Info.plist".
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: <App>

  <App>UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        type: syncedFolder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: <App>

schemes:
  <App>-Unit:
    build:
      targets:
        <App>: all
    test:
      config: Debug
      targets:
        - <App>Tests
  <App>:
    build:
      targets:
        <App>: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - <App>Tests
        - <App>UITests
