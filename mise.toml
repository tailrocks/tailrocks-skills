[settings]
lockfile = true

[tools]
bun = "1.4.0"
"npm:oxfmt" = "0.64.0"

[tasks.lint]
description = "Validate every skill, manifest, catalog group, and reverse catalog"
run = "bun run scripts/generate-references.ts --check && bun run scripts/validate-skills.ts"

[tasks."protected-paths:check"]
description = "Fail when any frozen audit-migration path differs from its source SHA"
run = "bun run scripts/check-protected-paths.ts"

[tasks."audit-plan-state:check"]
description = "Validate audit migration row state and atomic closure"
run = "bun run scripts/check-audit-plan-state.ts --mode progress"

[tasks.fmt]
description = "Check formatting of the TypeScript this repository owns"
run = "oxfmt --check scripts docs/src docs/scripts docs/vite.config.ts docs/source.config.ts"

[tasks."fmt:write"]
description = "Format the TypeScript this repository owns"
run = "oxfmt scripts docs/src docs/scripts docs/vite.config.ts docs/source.config.ts"

[tasks."migration-check"]
description = "Prove audit-migration safety, ownership, generated docs, formatting, and deterministic tests"
run = "bun run scripts/check-protected-paths.ts && bun run scripts/check-audit-plan-state.ts --mode progress && bun run scripts/generate-references.ts --check && bun run scripts/validate-skills.ts && bun run scripts/generate-docs.ts --check && oxfmt --check scripts docs/src docs/scripts docs/vite.config.ts docs/source.config.ts && bun run scripts/run-migration-tests.ts"

[tasks.ci]
description = "Everything CI runs: lint, generated-file drift check, script tests"
run = "bun run scripts/generate-references.ts --check && bun run scripts/validate-skills.ts && bun run scripts/generate-docs.ts --check && bun run scripts/run-migration-tests.ts"

[tasks.test]
description = "Run the script test suite"
run = "bun run scripts/run-migration-tests.ts"

[tasks."pr:checkout"]
description = "Resolve, guard, switch, and verify one pull request checkout"
run = "bun run scripts/checkout-pr.ts"

[tasks.docs]
description = "Regenerate skill READMEs and documentation pages from SKILL.md"
run = "bun run scripts/generate-references.ts --write && bun run scripts/generate-docs.ts"

[tasks."docs:check"]
description = "Fail when a generated README or documentation page is out of date"
run = "bun run scripts/generate-references.ts --check && bun run scripts/generate-docs.ts --check"

[tasks."docs:dev"]
description = "Run the documentation site locally with hot reload"
dir = "docs"
run = "bun install --frozen-lockfile && bun run dev"

[tasks."docs:build"]
description = "Build the static documentation site"
dir = "docs"
run = "bun install --frozen-lockfile && bun run build"

[tasks."docs:preview"]
description = "Serve the built documentation site as GitHub Pages will"
dir = "docs"
run = "bun run preview"
