[settings]
lockfile = true

[tools]
bun = "1.4.0"
"npm:oxfmt" = "0.65.0"

[tasks.install]
description = "Provision every pinned tool from mise.lock"
run = "mise install --locked"

[tasks.build]
description = "Install docs dependencies and build the static documentation site"
dir = "docs"
run = "bun install --frozen-lockfile && bun run types:check && bun run build"

[tasks.lint]
description = "Validate every skill, manifest, catalog group, reverse catalog, generated docs, and shell templates"
run = "bun run scripts/generate-references.ts --check && bun run scripts/validate-skills.ts && bun run scripts/generate-docs.ts --check && find skills scripts -type d -name evals -prune -o -path '*/templates/*.sh' -type f -print0 | xargs -0 -n1 sh -n"

[tasks."audit-plan-state:check"]
description = "Validate audit migration row state and atomic closure"
run = "bun run scripts/check-audit-plan-state.ts --mode progress"

[tasks.fmt]
description = "Check formatting of the TypeScript this repository owns"
run = "oxfmt --check scripts docs/src docs/scripts docs/vite.config.ts docs/source.config.ts"

[tasks."fmt:write"]
description = "Format the TypeScript this repository owns"
run = "oxfmt scripts docs/src docs/scripts docs/vite.config.ts docs/source.config.ts"

[tasks."migration-check"]
description = "Prove audit progress, ownership, generated docs, formatting, and deterministic tests"
run = "bun run scripts/check-audit-plan-state.ts --mode progress && bun run scripts/generate-references.ts --check && bun run scripts/validate-skills.ts && bun run scripts/generate-docs.ts --check && oxfmt --check scripts docs/src docs/scripts docs/vite.config.ts docs/source.config.ts && bun run scripts/run-tests.ts"

[tasks.ci]
description = "Human aggregate: every gate the CI lane runs"
depends = ["install", "build", "test", "lint", "fmt"]

[tasks.test]
description = "Run the script test suite"
run = "bun run scripts/run-tests.ts"

[tasks."pr:checkout"]
description = "Resolve, guard, switch, and verify one pull request checkout"
run = "bun run scripts/checkout-pr.ts"

[tasks."pr:post-review"]
description = "Prepare or consume a separately authorized PR review posting challenge"
run = "bun run scripts/post-pr-review.ts"

[tasks."pr:merge-preflight"]
description = "Run bounded read-only merge readiness predicates"
run = "bun run scripts/merge-preflight.ts"

[tasks."pr:merge"]
description = "Consume an exact authorized merge request and reconcile its receipt"
run = "bun run scripts/merge-pr.ts --skill-file $MISE_PROJECT_ROOT/skills/tailrocks-merge-pr/SKILL.md"

[tasks.docs]
description = "Regenerate documentation pages from SKILL.md"
run = "bun run scripts/generate-references.ts --write && bun run scripts/generate-docs.ts"

[tasks."docs:check"]
description = "Fail when a generated documentation page or root catalog is out of date"
run = "bun run scripts/generate-references.ts --check && bun run scripts/generate-docs.ts --check"

[tasks."docs:dev"]
description = "Run the documentation site locally with hot reload"
dir = "docs"
run = "bun install --frozen-lockfile && bun run dev"

[tasks."docs:preview"]
description = "Serve the built documentation site as GitHub Pages will"
dir = "docs"
run = "bun run preview"
