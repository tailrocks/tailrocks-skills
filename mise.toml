[settings]
lockfile = true

[tools]
bun = "1.3.14"

[tasks.validate]
run = "bun run scripts/validate-skills.ts"

[tasks.ci]
run = "bun run scripts/validate-skills.ts && bun run scripts/generate-docs.ts --check && bun test scripts/"

[tasks.test]
run = "bun test scripts/"

[tasks.lint]
run = "bun run scripts/validate-skills.ts"

[tasks.fmt]
run = "bun run scripts/validate-skills.ts"

[tasks.docs]
description = "Regenerate skill READMEs and documentation pages from SKILL.md"
run = "bun run scripts/generate-docs.ts"

[tasks."docs:check"]
description = "Fail when a generated README or documentation page is out of date"
run = "bun run scripts/generate-docs.ts --check"

[tasks."docs:build"]
description = "Build the static documentation site"
dir = "docs"
run = "bun install --frozen-lockfile && bun run build"

[tasks.evals]
description = "Run one skill eval case (needs the claude CLI; spends budget)"
run = "bun scripts/run-evals.ts"
