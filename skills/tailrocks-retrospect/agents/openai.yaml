interface:
  display_name: "Retrospect"
  short_description: "Turn a shipped roadmap item's history into proposed skill patches"
  default_prompt: "Use $tailrocks-retrospect on the named roadmap item: rebuild which skills ran from the commit trailers and the item Log, diff that against its Decisions, Must not, and spec IDs, and write the record of proposed skill patches."
policy:
  allow_implicit_invocation: false
