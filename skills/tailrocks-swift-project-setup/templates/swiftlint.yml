# SwiftLint policy for a native macOS app.
# Gate invocation is `swiftlint --strict`. Without --strict a violation is a
# warning and the run exits successfully.

included:
  - Sources
  - Tests
  - UITests

excluded:
  - .build
  - DerivedData
  - Vendor

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  # swift-format owns layout. Leaving both to argue about it produces churn.
  - line_length
  - trailing_comma
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - vertical_parameter_alignment_on_call

# Force operations are errors in application code. Tests may force where the
# failure IS the assertion.
force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional:
  severity: error
  mode: all

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15

nesting:
  type_level: 2

custom_rules:
  hardcoded_corner_radius:
    name: "Hard-coded corner radius"
    regex: "(?:cornerRadius|cornerRadii)\\s*[:=(]\\s*[0-9]"
    message: "Derive the radius concentrically from the containing system surface; a numeric radius adjacent to a system container is a hard failure."
    severity: warning
    excluded: ".*Tests.*"

  vision_only_glass_api:
    name: "visionOS-only glass API"
    regex: "glassBackgroundEffect"
    message: "glassBackgroundEffect is visionOS only and does not exist on macOS."
    severity: error

# Rules disabled for legacy debt carry a narrow path scope and a reason, never a
# repository-wide disable. Add them here with an owner and a removal condition.
