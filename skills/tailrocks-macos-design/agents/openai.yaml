interface:
  display_name: "Tailrocks: macOS Design"
  short_description: "Design a macOS feature and bless it as a running Liquid Glass prototype"
  default_prompt: "Use $tailrocks-macos-design to write the experience brief, classify every region in a native component map, generate structurally different alternatives with realistic fixtures, score the selected direction against the rubric and its hard failures, and then build the runnable Liquid Glass prototype — fixed launch contract, fixture scenarios, recorded live sign-off — that tailrocks-macos-visual-qa captures after finalization."
policy:
  allow_implicit_invocation: false
